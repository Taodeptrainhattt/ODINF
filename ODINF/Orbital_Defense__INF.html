<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>Orbital Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1f;--ink:#e9eeff;--mut:#8f9cc9;--s1:#0d1330;--s2:#151d45;--line:#2a3566;--amber:#ffbf47;--gem:#5fe3ff;--hp:#ff6b86;--ok:#5dffb0;--f:"Chakra Petch","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font-family:inherit;color:inherit;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ic{width:1em;height:1em;vertical-align:-.14em;fill:currentColor;flex:none}
/* ---------- HUD ---------- */
#hud{position:fixed;z-index:3;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:rgba(10,15,40,.78);border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-weight:600;font-variant-numeric:tabular-nums}
#hud .l{justify-self:start;color:var(--gem);font-size:18px}
#hud .c{flex-direction:column;gap:5px;min-width:136px;align-items:stretch;text-align:center}
#hud .c b{font-size:16px;line-height:1}#hud .c small{font-size:11px;color:var(--mut);font-weight:500;line-height:1}
#hud .r{justify-self:end;flex-direction:column;align-items:stretch;gap:6px;min-width:92px}
#hud .r .top{display:flex;gap:8px;align-items:center;justify-content:flex-end;color:var(--hp);font-size:18px}
.meter{height:4px;border-radius:2px;background:#1b2552;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--amber);transition:width .25s}
#hHpBar i{background:var(--hp);width:100%}#hHpBar.low i{background:#ff3355}
#toast{position:fixed;z-index:4;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translate(-50%,-6px);max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(10,15,40,.94);border:1px solid var(--line);font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:var(--hp);color:#ffd5dd}
/* ---------- Dock ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(118px + env(safe-area-inset-bottom,0px));padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(9,13,36,.9),rgba(6,9,26,.98));border-top:1px solid var(--line);z-index:2;display:flex;flex-direction:column;gap:6px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#strip{flex:none;height:20px;line-height:20px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#strip b{font-weight:700;margin-right:10px;font-size:13px}
.dock{display:flex;gap:10px;flex:1;min-height:0}
#tws{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:4px 0 2px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
#tws::-webkit-scrollbar{display:none}
.tw{--c:#5dd6ff;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--s1);border:1px solid var(--line);border-top:2px solid var(--c);border-radius:10px;padding:4px 2px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.tw .badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;line-height:1;background:color-mix(in srgb,var(--c) 18%,transparent)}
.tw .nm{font-size:11px;font-weight:600;line-height:1;white-space:nowrap}
.tw .cost{font-size:11px;line-height:1;color:var(--gem);display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.tw.sel{border-color:var(--amber);background:var(--s2);transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.4)}
.tw.poor .cost{color:var(--hp)}
.tw.lock{background:repeating-linear-gradient(135deg,var(--s1) 0 6px,#0a1028 6px 12px);border-top-color:var(--line);color:var(--mut)}
.tw.lock .badge{background:#141b3d;color:var(--mut);font-size:15px}.tw.lock .cost{color:var(--mut)}
.acts{display:flex;flex-direction:column;gap:6px;flex:0 0 92px}
#go{white-space:nowrap;flex:1;border:0;border-radius:10px;background:linear-gradient(180deg,#ffd06b,#ffb22e);color:#2a1a00;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 2px 0 #b97a0c;padding:0 6px}
#go:active:not(:disabled){transform:translateY(1px);box-shadow:none}
#go:disabled{background:var(--s2);color:var(--mut);box-shadow:none;cursor:default}
#au{white-space:nowrap;flex:none;height:26px;border:1px solid var(--line);border-radius:8px;background:var(--s1);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;color:var(--mut)}
#au .sw{width:22px;height:12px;border-radius:6px;background:#26305f;position:relative;transition:background .15s}
#au .sw::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:var(--mut);transition:transform .15s,background .15s}
#au.on{color:var(--ink);border-color:#2f6b55}#au.on .sw{background:#1f6b50}#au.on .sw::after{transform:translateX(10px);background:var(--ok)}
/* ---------- Draw toolbar ---------- */
#dbar{position:fixed;left:0;right:0;bottom:0;padding:24px 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:6;background:linear-gradient(180deg,transparent,rgba(7,10,28,.96) 45%)}
#dbar.off{display:none}
.btn{padding:11px 20px;border-radius:10px;border:1px solid var(--line);background:var(--s1);font-size:14px;font-weight:600;cursor:pointer}
.btn.pri{background:linear-gradient(180deg,#ffd06b,#ffb22e);color:#2a1a00;border:0;box-shadow:0 2px 0 #b97a0c}
/* ---------- Menu ---------- */
#ui{position:fixed;inset:0;z-index:5;display:flex;padding:20px;overflow-y:auto;background:radial-gradient(ellipse at 50% 25%,rgba(12,18,54,.7),rgba(5,8,22,.94));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#ui.hide{display:none}
.shell{width:min(580px,100%);margin:auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:16px;align-items:center}
#mark{flex:0 0 80px;width:80px;height:80px}
h1{margin:0;font-size:clamp(28px,6.5vw,42px);line-height:1.05;font-weight:700}
#msg{margin:6px 0 0;color:var(--mut);font-size:14px;line-height:1.5}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0;padding:0;list-style:none}
.how li{display:flex;gap:10px;align-items:flex-start;padding:12px;background:rgba(14,20,52,.7);border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:1.4;color:#c6d0f5}
.how .e{font-size:20px;line-height:1}
h2{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--mut)}
#maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.map{padding:0;border:1px solid var(--line);border-radius:12px;background:var(--s1);cursor:pointer;overflow:hidden;text-align:left;transition:border-color .12s}
.map svg{display:block;width:100%;height:auto}
.map span{display:block;padding:7px 10px 8px;font-size:13px;font-weight:600}
.map.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.map.sel span::after{content:" ✓";color:var(--amber)}
.map.new{border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;color:var(--mut);font-weight:600;font-size:13px}
.map.new b{font-size:22px;line-height:1}
.foot{display:flex;align-items:center;justify-content:space-between;gap:14px}
#rec{font-size:13px;color:var(--mut)}#rec b{color:var(--amber);font-size:16px}
#btn{padding:14px 42px;border:0;border-radius:12px;background:linear-gradient(180deg,#ffd06b,#ffb22e);color:#2a1a00;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 3px 0 #b97a0c}
#btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b97a0c}
@media(max-width:520px){.how{grid-template-columns:1fr}.foot{flex-direction:column;align-items:stretch;gap:12px}#rec{text-align:center}#btn{width:100%}.tw{flex-basis:58px}.acts{flex-basis:88px}#go{font-size:13px}#au{font-size:11px;gap:5px}#hud .c{min-width:112px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 ctx.globalAlpha=1;
 ctx.restore();
}
const dbar=document.getElementById('dbar');
function startDraw(){drawing=true;dp=[];pdown=false;dpHint='';ui.classList.add('hide');bar.style.display='none';dbar.classList.remove('off')}
function exitDraw(){drawing=false;dbar.classList.add('off');bar.style.display='';ui.classList.remove('hide');menu()}
document.getElementById('dundo').onclick=()=>{dp=[];dpHint=''};
document.getElementById('dcancel').onclick=exitDraw;
document.getElementById('dok').onclick=()=>{let L=0;for(let i=1;i<dp.length;i++)L+=Math.hypot(dp[i].x-dp[i-1].x,dp[i].y-dp[i-1].y);
 if(dp.length<6||L<Math.min(W,PH)*.9){dpHint='Đường quá ngắn, hãy vẽ dài hơn!';return}
 let q=dp.map(p=>({x:p.x,y:p.y}));for(let k=0;k<2;k++){const o=q;q=o.map((p,i)=>i==0||i==o.length-1?p:{x:(o[i-1].x+p.x+o[i+1].x)/3,y:(o[i-1].y+p.y+o[i+1].y)/3})}
 const c=MAPS.length-1;MAPS[c].w=q.map(p=>[p.x/W,p.y/PH]);try{localStorage.setItem('od_map',JSON.stringify(MAPS[c].w))}catch(e){}
 mapI=c;build();exitDraw()};
cv.addEventListener('pointerdown',e=>{if(!drawing)return;dpHint='';dp=[{x:e.clientX,y:Math.min(PH-4,e.clientY)}];pdown=true});
cv.addEventListener('pointermove',e=>{if(!drawing||!pdown)return;const l=dp[dp.length-1],x=e.clientX,y=Math.min(PH-4,e.clientY);if(Math.hypot(x-l.x,y-l.y)>=18)dp.push({x,y})});
addEventListener('pointerup',()=>{pdown=false});
(function loop(){if(run)update();else t++;draw();requestAnimationFrame(loop)})();
</script>
